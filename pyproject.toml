[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neuron-atlas-interface"
version = "0.1.0"
description = "Search interface, REST API, MCP server, mirror tool and geometry toolkit for Goodfire's Qwen3.6 Neuron Atlas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erikiss" }]
keywords = ["interpretability", "neurons", "atlas", "goodfire", "qwen", "mcp", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
umap = ["umap-learn>=0.5"]
embeddings = ["fastembed>=0.4"]
parquet = ["pyarrow>=15"]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "mcp>=1.2",
]
all = ["mcp>=1.2", "umap-learn>=0.5", "pyarrow>=15"]

[project.scripts]
neuron-atlas = "neuron_atlas.cli:app"
atlas = "neuron_atlas.cli:app"

[project.urls]
Homepage = "https://github.com/Erikiss/Interface-Neuron-Atlas-by-GoodFire-AI"
"Original atlas" = "https://www.goodfire.com/research/public_neuron_atlas"

[tool.hatch.build.targets.wheel]
packages = ["src/neuron_atlas"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: talks to the real upstream atlas (deselected by default; run with -m live)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
